# Beacon 0G on Render. No secrets in this file.
# API listens on $PORT. Web is a static Vite build.

services:
  - type: web
    name: beacon-0g-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: "16661"
      - key: NETWORK_NAME
        value: aristotle
      - key: TEE_FAIL_CLOSED
        value: "true"
      - key: ENABLE_SWAP
        value: "true"
      - key: ENABLE_VIDEO
        value: "false"
      - key: ENABLE_X402
        value: "false"
      - key: BEACON_VAULT_FACTORY
        value: "0x531e8533aBA2Ca534959Df860C3226c02EaC3eE1"
      - key: BEACON_JOB_ESCROW
        value: "0xFB9c10423EAaD015dDb04f5aC85273f1B3F7A566"
      - key: BEACON_RECEIPT_REGISTRY
        value: "0x31666B7ECf736c0c6014F0cd63C646B7f4Af3887"
      - key: COMPUTE_API_KEY
        sync: false
      - key: SETTLER_PRIVATE_KEY
        sync: false
      - key: ZEROG_DEPLOYER_PK
        sync: false
      - key: ZEROG_EVIDENCE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false

# Web is hosted on Vercel (not Render). API stays here.
